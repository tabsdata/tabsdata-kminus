[tasks.__km__audit_rs_kcommon]
plugin = "td-task-tracker"
category = "07 - Shield"
description = "Task 'audit' for kcommon project"
cwd = "${KM_ROOT}/mods/kcommon"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-km/libraries/log.ds

    # cargo audit reads its ignore list from .cargo/audit.toml in the working folder.
    cd ${TABSDATA_ROOT}

    debug "🚀 cargo audit --deny warnings --file ${PROJECT_RS_KCOMMON_FOLDER}/Cargo.lock"
    exec --fail-on-error cargo audit --deny warnings --file ${PROJECT_RS_KCOMMON_FOLDER}/Cargo.lock
'''

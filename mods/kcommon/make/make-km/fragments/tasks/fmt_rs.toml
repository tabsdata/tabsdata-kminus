[tasks.__km__fmt_rs_kcommon]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Task 'fmt' for kcommon project"
cwd = "${KM_ROOT}/mods/kcommon"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-km/libraries/log.ds

    debug "🚀 cargo fmt --manifest-path ${PROJECT_RS_KCOMMON_CARGO_TOML} --all --check"
    exec --fail-on-error cargo fmt --manifest-path ${PROJECT_RS_KCOMMON_CARGO_TOML} --all --check
'''

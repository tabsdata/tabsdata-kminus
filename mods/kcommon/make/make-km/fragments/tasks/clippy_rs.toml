[tasks.__km__clippy_rs_kcommon]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Task 'clippy' for kcommon project"
cwd = "${KM_ROOT}"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-km/libraries/log.ds

    debug "🚀 ${td-cargo} %{td-toolchain-token}%{td-toolchain} clippy %{td-rust-quiet} --locked %{td-target-token} %{td-target} --all-targets --all-features --profile ${td-profile} --manifest-path ${PROJECT_RS_KCOMMON_CARGO_TOML} -- -D warnings"
    exec --fail-on-error ${td-cargo} %{td-toolchain-token}%{td-toolchain} clippy %{td-rust-quiet} --locked %{td-target-token} %{td-target} --all-targets --all-features --profile ${td-profile} --manifest-path ${PROJECT_RS_KCOMMON_CARGO_TOML} -- -D warnings
'''

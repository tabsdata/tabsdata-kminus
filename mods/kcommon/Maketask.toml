extend = [
    { path = "./make/fragments/plugins/tasks.toml", relative = "git" },

    { path = "./make/fragments/tasks/permit_py.toml", relative = "git" },
    { path = "./make/fragments/tasks/permit_rs.toml", relative = "git" },
    { path = "./make/fragments/tasks/permit_go.toml", relative = "git" },

    { path = "./make/fragments/common/permit.toml", relative = "git" },

    { path = "./mods/kcommon/make/fragments/tasks/clean_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/fragments/tasks/lock_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/fragments/tasks/build_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/fragments/tasks/test_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/fragments/tasks/itest_rs.toml", relative = "git" },

    { path = "./make/fragments/hooks/banner.toml", relative = "git" },
    { path = "./make/fragments/hooks/start.toml", relative = "git" },
    { path = "./make/fragments/hooks/stop.toml", relative = "git" },
    { path = "./make/fragments/hooks/failure.toml", relative = "git" },
]

[tasks.clean]
plugin = "td-task-tracker"
category = "01 - Clean"
description = "Clean kcommon (use --all to also wipe caches)"
alias = "__km__clean_rs_kcommon"

[tasks.lock]
plugin = "td-task-tracker"
category = "02 - Tidy"
description = "Regenerate kcommon lockfile"
alias = "__km__lock_rs_kcommon"

[tasks.build]
plugin = "td-task-tracker"
category = "03 - Build"
description = "Build kcommon"
alias = "__km__build_rs_kcommon"

[tasks.test]
plugin = "td-task-tracker"
category = "04 - Test"
description = "Test kcommon"
alias = "__km__test_rs_kcommon"

[tasks.itest]
plugin = "td-task-tracker"
category = "04 - Test"
description = "Run kcommon integration tests"
alias = "__km__itest_rs_kcommon"

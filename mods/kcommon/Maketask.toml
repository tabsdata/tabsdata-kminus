[tasks.clean]
plugin = "td-task-tracker"
category = "01 - Clean"
description = "Clean kcommon (use --all to also wipe caches)"
alias = "__km__clean_rs_kcommon"

[tasks.lock]
plugin = "td-task-tracker"
category = "02 - Tidy"
description = "Regenerate kcommon lockfile"
alias = "__km__lock_rs_kcommon"

[tasks.build]
plugin = "td-task-tracker"
category = "03 - Build"
description = "Build kcommon"
alias = "__km__build_rs_kcommon"

[tasks.test]
plugin = "td-task-tracker"
category = "04 - Test"
description = "Test kcommon"
alias = "__km__test_rs_kcommon"

[tasks.itest]
plugin = "td-task-tracker"
category = "04 - Test"
description = "Run kcommon integration tests"
alias = "__km__itest_rs_kcommon"

[tasks.check]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Check kcommon"
alias = "__km__check_rs_kcommon"

[tasks.clippy]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Run clippy on kcommon"
alias = "__km__clippy_rs_kcommon"

[tasks.fmt]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Format kcommon"
alias = "__km__fmt_rs_kcommon"

[tasks.license]
plugin = "td-task-tracker"
category = "06 - Compliance"
description = "Report licenses for kcommon"
alias = "__km__license_rs_kcommon"

[tasks.outdated]
plugin = "td-task-tracker"
category = "05 - Inspect"
description = "Report outdated dependencies for kcommon"
alias = "__km__outdated_rs_kcommon"

[tasks.machete]
plugin = "td-task-tracker"
category = "05 - Inspect"
description = "Run machete on kcommon"
alias = "__km__machete_rs_kcommon"

[tasks.audit]
plugin = "td-task-tracker"
category = "07 - Shield"
description = "Audit kcommon"
alias = "__km__audit_rs_kcommon"

[tasks.deny]
plugin = "td-task-tracker"
category = "07 - Shield"
description = "Run deny on kcommon"
alias = "__km__deny_rs_kcommon"

[tasks.pants]
plugin = "td-task-tracker"
category = "07 - Shield"
description = "Run pants on kcommon"
alias = "__km__pants_rs_kcommon"

[tasks.compose]
plugin = "td-task-tracker"
category = "00 - Make"
description = "Task 'compose' for kcommon project"
private = true
run_task = [
    { name = [
        "build",
        "test",
        "check",
        "clippy",
        "fmt",
        "license",
        "outdated",
        "machete",
        "audit",
        "deny",
        "pants"
    ] }
]

[tasks.make]
plugin = "td-task-tracker"
category = "00 - Make"
description = "Full build and verification"
run_task = [
    { name = [
        "clean",
        "compose"], condition = { env = { "CLEAN" = "true" } } },
    { name = [
        "compose"
    ] }
]

[tasks.default]
plugin = "td-task-tracker"
alias = "make"

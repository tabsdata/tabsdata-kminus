    { path = "./make/make-km/fragments/plugins/tasks.toml", relative = "git" },

    { path = "./make/make-km/fragments/tasks/permit_py.toml", relative = "git" },
    { path = "./make/make-km/fragments/tasks/permit_rs.toml", relative = "git" },
    { path = "./make/make-km/fragments/tasks/permit_go.toml", relative = "git" },

    { path = "./make/make-km/fragments/common/permit.toml", relative = "git" },

    { path = "./mods/kcommon/make/make-km/fragments/tasks/clean_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/make-km/fragments/tasks/lock_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/make-km/fragments/tasks/build_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/make-km/fragments/tasks/test_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/make-km/fragments/tasks/itest_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/make-km/fragments/tasks/check_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/make-km/fragments/tasks/clippy_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/make-km/fragments/tasks/fmt_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/make-km/fragments/tasks/license_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/make-km/fragments/tasks/outdated_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/make-km/fragments/tasks/machete_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/make-km/fragments/tasks/audit_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/make-km/fragments/tasks/deny_rs.toml", relative = "git" },
    { path = "./mods/kcommon/make/make-km/fragments/tasks/pants_rs.toml", relative = "git" },

    { path = "./make/make-km/fragments/hooks/banner.toml", relative = "git" },
    { path = "./make/make-km/fragments/hooks/start.toml", relative = "git" },
    { path = "./make/make-km/fragments/hooks/stop.toml", relative = "git" },
    { path = "./make/make-km/fragments/hooks/failure.toml", relative = "git" },

[package]
description = "Tabsdata common components between Tabsdata and Tabsdata Kubernetes."
name = "kcommon"
edition = "2024"
version = "2.1.0"

authors = [
    "Aleix Lascorz Guiu    (tabsleix)      <aleix@tabsdata.com>",
    "Alejandro Abdelnur    (tucu0)         <tucu@tabsdata.com>",
    "Arvind Prabhakar      (aptabs)        <arvind@tabsdata.com>",
    "David Sánchez Frías   (tabsdavid)     <david@tabsdata.com>",
    "Dimas Cabré i Chacón  (aoinokimi)     <dragon@tabsdata.com>",
    "Joaquín Bo Díaz       (joaquin041)    <joaquin@tabsdata.com>",
    "Shreyas Vankayalapati (shreyasvan001) <shreyans@tabsdata.com>"
]
homepage = "https://www.tabsdata.com"
publish = false
repository = "https://github.com/tabsdata/tabsdata-km"
rust-version = "1.94.1"

[profile.dev]
codegen-units = 32
debug = true
incremental = true
lto = "off"
opt-level = 0
panic = "unwind"
strip = "none"

[profile.integration]
inherits = "release"
codegen-units = 64
incremental = true
lto = "off"
opt-level = 0

[profile.assembly]
inherits = "release"
codegen-units = 1
debug = 0
incremental = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "debuginfo"

[lib]

[package.metadata.cargo-machete]
ignored = ["openssl"]

[dependencies]

chrono = { version = "0.4.44" }
sysinfo = { version = "0.37.2" }
tracing = { version = "0.1.44" }

[dev-dependencies]

serial_test = { version = "3" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10.76", features = ["vendored"] }

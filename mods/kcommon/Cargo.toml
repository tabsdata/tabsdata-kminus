[package]
description = "Tabsdata common components between Tabsdata and Tabsdata Kubernetes."
name = "kcommon"
edition = "2024"
version = "2.4.1"

authors = [
    "Aleix Lascorz Guiu    (tabsleix)      <aleix@tabsdata.com>",
    "Alejandro Abdelnur    (tucu0)         <tucu@tabsdata.com>",
    "Arvind Prabhakar      (aptabs)        <arvind@tabsdata.com>",
    "David Sánchez Frías   (tabsdavid)     <david@tabsdata.com>",
    "Dimas Cabré i Chacón  (aoinokimi)     <dragon@tabsdata.com>",
    "Joaquín Bo Díaz       (joaquin041)    <joaquin@tabsdata.com>",
    "Shreyas Vankayalapati (shreyasvan001) <shreyans@tabsdata.com>"
]
homepage = "https://www.tabsdata.com"
publish = false
repository = "https://github.com/tabsdata/tabsdata-kminus"
rust-version = "1.99.1"

[lints.clippy]
large_futures = "deny"

[profile.dev]
codegen-units = 32
debug = true
incremental = true
lto = "off"
opt-level = 0
panic = "unwind"
strip = "none"

[profile.dev.package."*"]
debug = false

[profile.integration]
inherits = "release"
codegen-units = 64
incremental = true
lto = "off"
opt-level = 0

[profile.assembly]
inherits = "release"
codegen-units = 1
debug = 0
incremental = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "debuginfo"

[lib]

[features]
# The tests' log subscriber (see `test_tracing`), for the km crates' tests
test-tracing = ["dep:tracing-subscriber"]

[package.metadata.cargo-machete]
ignored = []

[dependencies]

chrono = { version = "0.4.45" }
sysinfo = { version = "0.40.1" }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }

[dev-dependencies]

ctor = { version = "1.0.14" }
serial_test = { version = "4" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }


# Run the process fork-stress tests in isolation under nextest.
#
# `process::executor::tests::test_fork_stress_*` each fork up to 1000
# long-lived child processes. The tests guard against concurrent execution
# with `#[serial(fork_stress)]`, but `serial_test`'s lock is process-local:
# it only serializes when every test shares one process, as with
# `cargo test`. nextest runs each test in its own process, so that lock has
# no effect — the fork-stress tests run alongside each other AND alongside
# the rest of the suite, exhausting OS process/FD limits and hanging the run
# (`cargo make test`).
#
# `threads-required = "num-test-threads"` makes each of these tests reserve
# every test slot, so nextest runs it entirely alone — no other test (fork
# stress or otherwise) runs concurrently. This restores the isolation the
# `#[serial]` attribute provides under `cargo test`. The `fork-stress` group
# (`max-threads = 1`) additionally documents and enforces that they never
# run as a batch.
[test-groups]
fork-stress = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(fork_stress)'
test-group = 'fork-stress'
threads-required = 'num-test-threads'

extend = [
    { path = "./make/fragments/plugins/tasks.toml", relative = "git" },

    { path = "./make/fragments/tasks/permit_py.toml", relative = "git" },
    { path = "./make/fragments/tasks/permit_rs.toml", relative = "git" },
    { path = "./make/fragments/tasks/permit_go.toml", relative = "git" },

    { path = "./make/fragments/common/permit.toml", relative = "git" },

    { path = "./mods/pod-runner/make/fragments/tasks/clean_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/fragments/tasks/lock_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/fragments/tasks/build_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/fragments/tasks/test_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/fragments/tasks/itest_rs.toml", relative = "git" },

    # itest needs the Go binaries (control-plane, virtual-kubelet)
    # alongside pod-runner; bring in their build tasks plus the assembly
    # copy step so `cargo make itest` works without manual binary plumbing.
    { path = "./mods/control-plane/make/fragments/tasks/build_go.toml", relative = "git" },
    { path = "./mods/virtual-kubelet/make/fragments/tasks/build_go.toml", relative = "git" },
    { path = "./make/fragments/tasks/assembly.toml", relative = "git" },

    { path = "./make/fragments/hooks/banner.toml", relative = "git" },
    { path = "./make/fragments/hooks/start.toml", relative = "git" },
    { path = "./make/fragments/hooks/stop.toml", relative = "git" },
    { path = "./make/fragments/hooks/failure.toml", relative = "git" },
]

[tasks.clean]
plugin = "td-task-tracker"
category = "01 - Clean"
description = "Clean pod-runner (use --all to also wipe caches)"
alias = "__km__clean_rs_pod_runner"

[tasks.lock]
plugin = "td-task-tracker"
category = "02 - Tidy"
description = "Regenerate pod-runner lockfile"
alias = "__km__lock_rs_pod_runner"

[tasks.build]
plugin = "td-task-tracker"
category = "03 - Build"
description = "Build pod-runner"
alias = "__km__build_rs_pod_runner"

[tasks.test]
plugin = "td-task-tracker"
category = "04 - Test"
description = "Test pod-runner"
alias = "__km__test_rs_pod_runner"

[tasks.itest]
plugin = "td-task-tracker"
category = "04 - Test"
description = "Run pod-runner integration tests"
alias = "__km__itest_rs_pod_runner"

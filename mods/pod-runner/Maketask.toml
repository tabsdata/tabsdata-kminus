extend = [
    { path = "./make/make-km/fragments/plugins/tasks.toml", relative = "git" },

    { path = "./make/make-km/fragments/tasks/permit_py.toml", relative = "git" },
    { path = "./make/make-km/fragments/tasks/permit_rs.toml", relative = "git" },
    { path = "./make/make-km/fragments/tasks/permit_go.toml", relative = "git" },

    { path = "./make/make-km/fragments/common/permit.toml", relative = "git" },

    { path = "./mods/pod-runner/make/make-km/fragments/tasks/clean_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/lock_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/build_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/test_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/itest_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/check_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/clippy_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/fmt_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/license_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/outdated_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/machete_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/audit_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/deny_rs.toml", relative = "git" },
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/pants_rs.toml", relative = "git" },

    { path = "./make/make-km/fragments/hooks/banner.toml", relative = "git" },
    { path = "./make/make-km/fragments/hooks/start.toml", relative = "git" },
    { path = "./make/make-km/fragments/hooks/stop.toml", relative = "git" },
    { path = "./make/make-km/fragments/hooks/failure.toml", relative = "git" },
]

[tasks.clean]
plugin = "td-task-tracker"
category = "01 - Clean"
description = "Clean pod-runner (use --all to also wipe caches)"
alias = "__km__clean_rs_pod_runner"

[tasks.lock]
plugin = "td-task-tracker"
category = "02 - Tidy"
description = "Regenerate pod-runner lockfile"
alias = "__km__lock_rs_pod_runner"

[tasks.build]
plugin = "td-task-tracker"
category = "03 - Build"
description = "Build pod-runner"
alias = "__km__build_rs_pod_runner"

[tasks.test]
plugin = "td-task-tracker"
category = "04 - Test"
description = "Test pod-runner"
alias = "__km__test_rs_pod_runner"

[tasks.itest]
plugin = "td-task-tracker"
category = "04 - Test"
description = "Run pod-runner integration tests"
alias = "__km__itest_rs_pod_runner"

[tasks.check]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Check pod-runner"
alias = "__km__check_rs_pod_runner"

[tasks.clippy]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Run clippy on pod-runner"
alias = "__km__clippy_rs_pod_runner"

[tasks.fmt]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Format pod-runner"
alias = "__km__fmt_rs_pod_runner"

[tasks.license]
plugin = "td-task-tracker"
category = "06 - Compliance"
description = "Report licenses for pod-runner"
alias = "__km__license_rs_pod_runner"

[tasks.outdated]
plugin = "td-task-tracker"
category = "05 - Inspect"
description = "Report outdated dependencies for pod-runner"
alias = "__km__outdated_rs_pod_runner"

[tasks.machete]
plugin = "td-task-tracker"
category = "05 - Inspect"
description = "Run machete on pod-runner"
alias = "__km__machete_rs_pod_runner"

[tasks.audit]
plugin = "td-task-tracker"
category = "07 - Shield"
description = "Audit pod-runner"
alias = "__km__audit_rs_pod_runner"

[tasks.deny]
plugin = "td-task-tracker"
category = "07 - Shield"
description = "Run deny on pod-runner"
alias = "__km__deny_rs_pod_runner"

[tasks.pants]
plugin = "td-task-tracker"
category = "07 - Shield"
description = "Run pants on pod-runner"
alias = "__km__pants_rs_pod_runner"

[tasks.compose]
plugin = "td-task-tracker"
category = "00 - Make"
description = "Task 'compose' for pod-runner project"
private = true
run_task = [
    { name = [
        "build",
        "test",
        "check",
        "clippy",
        "fmt",
        "license",
        "outdated",
        "machete",
        "audit",
        "deny",
        "pants"
    ] }
]

[tasks.make]
plugin = "td-task-tracker"
category = "00 - Make"
description = "Full build and verification"
run_task = [
    { name = [
        "clean",
        "compose"], condition = { env = { "CLEAN" = "true" } } },
    { name = [
        "compose"
    ] }
]

[tasks.default]
plugin = "td-task-tracker"
alias = "make"

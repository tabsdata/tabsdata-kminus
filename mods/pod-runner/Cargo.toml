[package]
description = "Tabsdata Pod Runner: lightweight Kubernetes-style pod executor with HTTP server and CLI client."
name = "pod-runner"
edition = "2024"
version = "2.3.0"

authors = [
    "Aleix Lascorz Guiu    (tabsleix)      <aleix@tabsdata.com>",
    "Alejandro Abdelnur    (tucu0)         <tucu@tabsdata.com>",
    "Arvind Prabhakar      (aptabs)        <arvind@tabsdata.com>",
    "David Sánchez Frías   (tabsdavid)     <david@tabsdata.com>",
    "Dimas Cabré i Chacón  (aoinokimi)     <dragon@tabsdata.com>",
    "Joaquín Bo Díaz       (joaquin041)    <joaquin@tabsdata.com>",
    "Shreyas Vankayalapati (shreyasvan001) <shreyans@tabsdata.com>"
]
homepage = "https://www.tabsdata.com"
publish = false
repository = "https://github.com/tabsdata/tabsdata-km"
rust-version = "1.99.1"

[lib]

[[bin]]
name = "pod-runner"
path = "src/server/main.rs"

[[bin]]
name = "kpr"
path = "src/client/main.rs"

[features]

default = ["k8s-openapi/latest"]

[profile.dev]
codegen-units = 32
debug = true
incremental = true
lto = "off"
opt-level = 0
panic = "unwind"
strip = "none"

[profile.dev.package."*"]
debug = false

[profile.integration]
inherits = "release"
codegen-units = 64
incremental = true
lto = "off"
opt-level = 0

[profile.assembly]
inherits = "release"
codegen-units = 1
debug = 0
incremental = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "debuginfo"

[package.metadata.cargo-machete]
ignored = []

[dependencies]

async-trait = { version = "0.1.92" }
axum = { version = "0.8.9" }
base64 = { version = "0.23.1" }
bytes = { version = "1.12.1" }
chrono = { version = "0.4.45" }
clap = { version = "4.6.7", features = ["derive"] }
dunce = { version = "1.0.5" }
file-rotate = { version = "0.8" }
flate2 = { version = "1" }
futures-util = { version = "0.3.34" }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
k8s-openapi = { version = "0.29" }
kcommon = { path = "../kcommon" }
kube = { version = "5.0", features = ["runtime", "derive", "client"] }
memory-stats = { version = "1" }
prometheus = { version = "0.14" }
rcgen = { version = "0.14" }
reqwest = { version = "0.13.5", features = ["rustls", "stream", "json", "query"], default-features = false }
rustls = { version = "0.23.46" }
rustls-pemfile = { version = "2" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
serde_yaml_ng = { version = "0.10" }
strum = { version = "0.28.0", features = ["derive"] }
sysinfo = { version = "0.39.6" }
tar = { version = "0.4" }
thiserror = { version = "2" }
time = { version = "0.3" }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26" }
tokio-stream = { version = "0.1" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]

chrono = { version = "0.4.45" }
data-encoding = { version = "2.11.1" }
filetime = { version = "0.2.29" }
http-body-util = { version = "0.1" }
hyper = { version = "1" }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
libc = { version = "0.2.191" }
rstest = { version = "0.28" }
serial_test = { version = "4" }
# `test-util` enables `tokio::time::pause()` / `#[tokio::test(start_paused
# = true)]` used by the resolver backoff tests so they can validate
# multi-minute waits in milliseconds.
tokio = { version = "1.54.1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

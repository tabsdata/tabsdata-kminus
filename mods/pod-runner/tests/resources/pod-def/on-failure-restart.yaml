# Pod with OnFailure restart policy.
apiVersion: v1
kind: Pod
metadata:
  name: on-failure-restart
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: OnFailure
  containers:
    - name: app
      image: /dev/null
      command: ["sh", "-c"]
      args: ["echo 'on-failure pod'"]

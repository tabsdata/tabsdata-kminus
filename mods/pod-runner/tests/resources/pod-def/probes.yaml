#
# Pod with exec-based liveness and readiness probes.
# Uses exec probes since they work with process-based execution
# (no real network stack for httpGet/tcpSocket in tests).
apiVersion: v1
kind: Pod
metadata:
  name: probes
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  containers:
    - name: app
      image: /dev/null
      command: ["python", "-c"]
      args:
        - |
          import time
          print('healthy', flush=True)
          time.sleep(3)
          print('done')
      livenessProbe:
        exec:
          command: ["python", "-c", "pass"]
        initialDelaySeconds: 0
        periodSeconds: 1
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        exec:
          command: ["python", "-c", "pass"]
        initialDelaySeconds: 0
        periodSeconds: 1
        timeoutSeconds: 5
        successThreshold: 1

# Pod with init containers that run sequentially before the main container.
apiVersion: v1
kind: Pod
metadata:
  name: init-containers
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  initContainers:
    - name: init-a
      image: /dev/null
      command: ["python", "-c"]
      args: ["print('init-a done')"]
    - name: init-b
      image: /dev/null
      command: ["python", "-c"]
      args: ["print('init-b done')"]
  containers:
    - name: app
      image: /dev/null
      command: ["python", "-c"]
      args: ["print('app started after inits')"]

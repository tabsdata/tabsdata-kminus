#
# Pod with hostPath and emptyDir volume mounts.
# The hostPath directory and emptyDir are set up at test time.
# Mount paths must be under /mounts (PR constraint).
#
# Commands use $KM_CONTAINER_ROOT (injected during resolution) to access
# the resolved mount paths — since absolute K8s paths like /mounts/input
# get rewritten to <container_root>/mounts/input during preparation.
apiVersion: v1
kind: Pod
metadata:
  name: mounts
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  containers:
    - name: app
      image: /dev/null
      command: ["sh", "-c"]
      args: ["cat $KM_CONTAINER_ROOT/mounts/input/data.txt && echo 'wrote' > $KM_CONTAINER_ROOT/mounts/scratch/output.txt && echo 'wrote-to-host' > $KM_CONTAINER_ROOT/mounts/output/from-pod.txt"]
      volumeMounts:
        - name: input-vol
          mountPath: /mounts/input
          readOnly: true
        - name: scratch-vol
          mountPath: /mounts/scratch
        - name: output-vol
          mountPath: /mounts/output
  volumes:
    - name: input-vol
      hostPath:
        path: "{{HOST_PATH}}"
        type: Directory
    - name: scratch-vol
      emptyDir: {}
    - name: output-vol
      hostPath:
        path: "{{HOST_OUT_PATH}}"
        type: Directory

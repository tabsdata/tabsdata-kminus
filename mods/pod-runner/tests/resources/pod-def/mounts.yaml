#
# Pod with hostPath and emptyDir volume mounts.
# The hostPath directory and emptyDir are set up at test time.
# Mount paths must be under /mounts (PR constraint).
#
# Commands use $KM_CONTAINER_ROOT (injected during resolution) to access
# the resolved mount paths — since absolute K8s paths like /mounts/input
# get rewritten to <container_root>/mounts/input during preparation.
apiVersion: v1
kind: Pod
metadata:
  name: mounts
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  containers:
    - name: app
      image: /dev/null
      command: ["python", "-c"]
      args:
        - |
          import os, sys
          root = os.environ['KM_CONTAINER_ROOT']
          for parts in [('mounts', 'input', 'data.txt')]:
              with open(os.path.join(root, *parts), 'rb') as f:
                  sys.stdout.buffer.write(f.read())
          with open(os.path.join(os.environ['KM_CONTAINER_ROOT'], 'mounts', 'scratch', 'output.txt'), 'w', encoding='utf-8', newline='\n') as f:
              f.write('wrote\n')
          with open(os.path.join(os.environ['KM_CONTAINER_ROOT'], 'mounts', 'output', 'from-pod.txt'), 'w', encoding='utf-8', newline='\n') as f:
              f.write('wrote-to-host\n')
      volumeMounts:
        - name: input-vol
          mountPath: /mounts/input
          readOnly: true
        - name: scratch-vol
          mountPath: /mounts/scratch
        - name: output-vol
          mountPath: /mounts/output
  volumes:
    - name: input-vol
      hostPath:
        path: "{{HOST_PATH}}"
        type: Directory
    - name: scratch-vol
      emptyDir: {}
    - name: output-vol
      hostPath:
        path: "{{HOST_OUT_PATH}}"
        type: Directory

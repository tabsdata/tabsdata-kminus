# Minimal pod: one container with command and args.
apiVersion: v1
kind: Pod
metadata:
  name: single-container
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  containers:
    - name: app
      image: /dev/null
      command: ["python", "-c"]
      args: ["print('hello from single-container')"]

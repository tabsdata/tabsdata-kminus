#
# Kitchen-sink pod exercising multiple features at once:
# init container, sidecar, main containers, literal env vars,
# volume mounts (hostPath + emptyDir), and exec probes.
#
# Does NOT include secrets or configmaps so it can run through
# the standard server/serverless entry points without resolvers.
apiVersion: v1
kind: Pod
metadata:
  name: kitchen-sink
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  initContainers:
    - name: setup
      image: /dev/null
      command: ["python", "-c"]
      args: ["print('init-setup done')"]
    - name: sidecar-logger
      image: /dev/null
      command: ["python", "-c"]
      args:
        - |
          import time
          while True:
              time.sleep(1)
      restartPolicy: Always
  containers:
    - name: main
      image: /dev/null
      command: ["python", "-c"]
      args:
        - |
          import os, time
          print(f"MSG={os.environ.get('MSG', '')}", flush=True)
          with open(os.path.join(os.environ['KM_CONTAINER_ROOT'], 'mounts', 'scratch', 'main.txt'), 'w', encoding='utf-8', newline='\n') as f:
              f.write('main wrote\n')
          time.sleep(2)
          print('main done')
      env:
        - name: MSG
          value: kitchen-sink-test
      volumeMounts:
        - name: scratch
          mountPath: /mounts/scratch
      readinessProbe:
        exec:
          command: ["python", "-c", "pass"]
        initialDelaySeconds: 0
        periodSeconds: 1
    - name: helper
      image: /dev/null
      command: ["python", "-c"]
      args: ["print('helper done')"]
  volumes:
    - name: scratch
      emptyDir: {}

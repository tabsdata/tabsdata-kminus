#
# Pod that prints 10 numbered lines and exits — used by container-log
# streaming tests (tailLines, timestamps, follow).
apiVersion: v1
kind: Pod
metadata:
  name: log-lines
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  containers:
    - name: app
      image: /dev/null
      command: ["python", "-c"]
      args:
        - |
          for i in range(10):
              print(f"line-{i}")

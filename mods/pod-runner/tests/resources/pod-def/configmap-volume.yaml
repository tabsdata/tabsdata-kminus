#
# Pod that mounts a configmap as a volume.
# Each key in the configmap becomes a file in the mount directory
# (filename = key, contents = value).
# Requires a ConfigMapResolver to be configured at create time.
#
# Convention: configmaps are mounted at /configmaps/<configmap-name>.
# kminus only supports mounting an entire configmap as a directory; per-key
# selection (configMap.items) and per-file mounts (volumeMount.subPath) are
# not supported.
#
# Note: the pod runner rewrites the absolute mount path to
# <container_root>/<mountPath> during preparation, so the command uses
# $KM_CONTAINER_ROOT to access the resolved location.
apiVersion: v1
kind: Pod
metadata:
  name: configmap-volume
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  containers:
    - name: app
      image: /dev/null
      command: ["python", "-c"]
      args:
        - |
          import os, sys
          root = os.environ['KM_CONTAINER_ROOT']
          for parts in [('configmaps', 'db-config', 'host'), ('configmaps', 'db-config', 'port')]:
              with open(os.path.join(root, *parts), 'rb') as f:
                  sys.stdout.buffer.write(f.read())
      volumeMounts:
        - name: config
          mountPath: /configmaps/db-config
          readOnly: true
  volumes:
    - name: config
      configMap:
        name: db-config

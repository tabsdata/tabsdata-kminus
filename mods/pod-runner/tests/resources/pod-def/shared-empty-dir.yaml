#
# Pod with an emptyDir volume shared between two containers.
#
# Volumes are pod-level (materialized under <pod_dir>/volumes/ and
# symlinked into each container's mount path), so a file written by one
# container must be visible through the other container's mount.
#
# The writer creates a marker file through its mount; the reader polls
# through its own mount until the marker appears (or fails after ~10s).
# The pod only Succeeds when the emptyDir is genuinely shared.
apiVersion: v1
kind: Pod
metadata:
  name: shared-empty-dir
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  containers:
    - name: writer
      image: /dev/null
      command: ["python", "-c"]
      args:
        - |
          import os
          with open(os.path.join(os.environ['KM_CONTAINER_ROOT'], 'mounts', 'shared', 'marker.txt'), 'w', encoding='utf-8', newline='\n') as f:
              f.write('shared-data\n')
      volumeMounts:
        - name: shared-vol
          mountPath: /mounts/shared
    - name: reader
      image: /dev/null
      command: ["python", "-c"]
      args:
        - |
          import os, sys, time
          marker = os.path.join(os.environ['KM_CONTAINER_ROOT'], 'mounts', 'shared', 'marker.txt')
          for _ in range(50):
              if os.path.isfile(marker):
                  with open(marker, encoding='utf-8') as f:
                      sys.exit(0 if 'shared-data' in f.read() else 1)
              time.sleep(0.2)
          sys.exit(1)
      volumeMounts:
        - name: shared-vol
          mountPath: /mounts/shared
  volumes:
    - name: shared-vol
      emptyDir: {}

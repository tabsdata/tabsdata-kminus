#
# Pod that exercises KM_CONTAINER_ROOT auto-injection and chained K8s-style
# $(VAR) substitution.
#
# pod-runner injects KM_CONTAINER_ROOT into every container with the
# container's physical working directory. The pod-runner preparation
# pipeline then performs K8s-style $(VAR) substitution on env values,
# command, and args. This pod:
#   - defines ROOT=$(KM_CONTAINER_ROOT) in the env block (substituted at
#     prep time to the absolute container working directory);
#   - uses $(ROOT) in another env value and in args (also substituted);
#   - asserts that the substituted shell vars resolve to the expected paths
#     and writes a marker file.
apiVersion: v1
kind: Pod
metadata:
  name: container-root
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  containers:
    - name: app
      image: /dev/null
      env:
        - name: ROOT
          value: $(KM_CONTAINER_ROOT)
        - name: MARKER
          value: $(ROOT)/marker.txt
      command: ["python", "-c"]
      args:
        - |
          import os, sys
          root = os.environ.get('ROOT', '')
          marker = os.environ.get('MARKER', '')
          if not root:
              print('ROOT unset'); sys.exit(1)
          if not os.path.isdir(root):
              print(f'ROOT not a dir: {root}'); sys.exit(2)
          if marker != root + '/marker.txt':
              print(f'MARKER mismatch: {marker}'); sys.exit(3)
          with open(os.path.join(r'$(ROOT)', 'marker.txt'), 'w', encoding='utf-8', newline='\n') as f:
              f.write('container-root-marker\n')
          if not os.path.isfile(marker):
              print(f'marker not written: {marker}'); sys.exit(4)
          print('OK')

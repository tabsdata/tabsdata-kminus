#
# Pod with a sidecar (init container with restartPolicy: Always).
# The sidecar runs alongside the main container and is terminated
# after the main container exits.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  initContainers:
    - name: sidecar-proxy
      image: /dev/null
      command: ["python", "-c"]
      args:
        - |
          import time
          while True:
              time.sleep(1)
      restartPolicy: Always
  containers:
    - name: app
      image: /dev/null
      command: ["python", "-c"]
      args: ["print('app with sidecar')"]

#
# Pod that references secrets via env valueFrom.secretKeyRef
# and via envFrom.secretRef (bulk loading).
# Requires a SecretResolver to be configured at create time.
apiVersion: v1
kind: Pod
metadata:
  name: secrets
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  containers:
    - name: app
      image: /dev/null
      command: ["python", "-c"]
      args:
        - |
          import os
          print(f"DB_PASS={os.environ.get('DB_PASS', '')} ALL_API_KEY={os.environ.get('API_KEY', '')}")
      env:
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
      envFrom:
        - secretRef:
            name: api-keys

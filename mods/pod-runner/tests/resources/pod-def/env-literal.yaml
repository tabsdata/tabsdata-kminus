# Pod with literal environment variables.
apiVersion: v1
kind: Pod
metadata:
  name: env-literal
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  containers:
    - name: app
      image: /dev/null
      command: ["python", "-c"]
      args:
        - |
          import os
          print(f"GREETING={os.environ.get('GREETING', '')} MODE={os.environ.get('MODE', '')}")
      env:
        - name: GREETING
          value: hello-world
        - name: MODE
          value: test

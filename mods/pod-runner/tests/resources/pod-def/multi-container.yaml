# Pod with multiple main containers running concurrently.
apiVersion: v1
kind: Pod
metadata:
  name: multi-container
  namespace: default

spec:
  nodeName: tdknode
  restartPolicy: Never
  containers:
    - name: writer
      image: /dev/null
      command: ["python", "-c"]
      args: ["print('output-from-writer')"]
    - name: reader
      image: /dev/null
      command: ["python", "-c"]
      args: ["print('output-from-reader')"]
    - name: worker
      image: /dev/null
      command: ["python", "-c"]
      args: ["print('output-from-worker')"]

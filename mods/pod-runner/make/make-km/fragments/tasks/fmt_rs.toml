[tasks.__km__fmt_rs_pod_runner]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Task 'fmt' for pod-runner project"
cwd = "${KM_ROOT}/mods/pod-runner"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-km/libraries/log.ds

    debug "🚀 cargo fmt --manifest-path ${PROJECT_RS_POD_RUNNER_CARGO_TOML} --all --check"
    exec --fail-on-error cargo fmt --manifest-path ${PROJECT_RS_POD_RUNNER_CARGO_TOML} --all --check
'''

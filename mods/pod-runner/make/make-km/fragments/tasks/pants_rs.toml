[tasks.__km__pants_rs_pod_runner]
plugin = "td-task-tracker"
category = "07 - Shield"
description = "Task 'pants' for pod-runner project"
cwd = "${KM_ROOT}/mods/pod-runner"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-km/libraries/log.ds

    debug "🚀 cargo pants --ignore-file ${PANTS_JSON} --tomlfile ${PROJECT_RS_POD_RUNNER_CARGO_TOML}"
    exec --fail-on-error cargo pants --ignore-file ${PANTS_JSON} --tomlfile ${PROJECT_RS_POD_RUNNER_CARGO_TOML}
'''

[tasks.__km__license_rs_pod_runner]
plugin = "td-task-tracker"
category = "06 - Compliance"
description = "Task 'license' for pod-runner project"
cwd = "${KM_ROOT}/mods/pod-runner"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-km/libraries/log.ds

    debug "🚀 cargo %{td-toolchain-token}%{td-toolchain} deny --locked --log-level error --all-features --manifest-path ${PROJECT_RS_POD_RUNNER_CARGO_TOML} --config ${DENY_TOML} check --hide-inclusion-graph licenses"
    exec --fail-on-error cargo %{td-toolchain-token}%{td-toolchain} deny --locked --log-level error --all-features --manifest-path ${PROJECT_RS_POD_RUNNER_CARGO_TOML} --config ${DENY_TOML} check --hide-inclusion-graph licenses
'''

[tasks.__km__itest_rs_pod_runner]
plugin = "td-task-tracker"
category = "04 - Test"
description = "Task 'itest' for pod-runner project"
dependencies = [
    "__km__build_rs_pod_runner",
    # The pod-runner integration tests spin up control-plane and
    # virtual-kubelet alongside pod-runner; build them and stage all
    # three binaries in target/dist via __km__assembly_root.
    "__km__build_go_control_plane",
    "__km__build_go_virtual_kubelet",
    "__km__assembly_root",
]
cwd = "${KM_ROOT}/mods/pod-runner/tests"
script_runner = "@duckscript"
script = '''
    km_root = get_env KM_ROOT
    test_folder = get_env KM_TEST_FOLDER

    # __km__assembly_root collects every binary the integration tests
    # need (pod-runner, control-plane, virtual-kubelet) into target/dist.
    bin_folder = concat ${km_root} "/target/dist"

    itest_folder = concat ${km_root} "/mods/pod-runner/tests"
    if is_dir ${itest_folder}
        set_env TD_BIN_FOLDER ${bin_folder}
        set_env PYTHONPATH ${test_folder}
        runner = concat ${test_folder} "/pytest-noop.sh"
        exec --fail-on-error ${runner} -v
    else
        echo (pod-runner: no integration tests -- skipping)
    end
'''

[tasks.__km__itest_rs_pod_runner]
plugin = "td-task-tracker"
category = "04 - Test"
description = "Task 'itest' for pod-runner project"
dependencies = [
    "__km__build_rs_pod_runner",
]
cwd = "${KM_ROOT}/mods/pod-runner/tests"
script_runner = "@duckscript"
script = '''
    km_root = get_env KM_ROOT
    test_folder = get_env KM_TEST_FOLDER
    profile = get_env profile

    build_folder = set ${profile}
    if eq ${profile} "dev"
        build_folder = set "debug"
    end

    # The pod-runner integration tests run pod-runner in isolation
    # (file-based resolvers, no control-plane), so the only binary
    # they need is `pod-runner` itself, sitting in this module's own
    # target/<profile> directory.
    bin_folder = concat ${km_root} "/mods/pod-runner/target/" ${build_folder}

    itest_folder = concat ${km_root} "/mods/pod-runner/tests"
    if is_dir ${itest_folder}
        set_env TD_BIN_FOLDER ${bin_folder}
        set_env PYTHONPATH ${test_folder}
        runner = concat ${test_folder} "/pytest-noop.sh"
        exec --fail-on-error ${runner} -v
    else
        echo (pod-runner: no integration tests -- skipping)
    end
'''

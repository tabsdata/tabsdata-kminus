extend = [
    { path = "./make/make-km/fragments/plugins/tasks.toml", relative = "git" },

    { path = "./make/make-km/fragments/tasks/permit_py.toml", relative = "git" },
    { path = "./make/make-km/fragments/tasks/permit_rs.toml", relative = "git" },
    { path = "./make/make-km/fragments/tasks/permit_go.toml", relative = "git" },

    { path = "./make/make-km/fragments/common/permit.toml", relative = "git" },

    { path = "./mods/kminus/make/make-km/fragments/tasks/clean_rs.toml", relative = "git" },
    { path = "./mods/kminus/make/make-km/fragments/tasks/lock_rs.toml", relative = "git" },
    { path = "./mods/kminus/make/make-km/fragments/tasks/build_rs.toml", relative = "git" },
    { path = "./mods/kminus/make/make-km/fragments/tasks/test_rs.toml", relative = "git" },
    { path = "./mods/kminus/make/make-km/fragments/tasks/itest_rs.toml", relative = "git" },
    { path = "./mods/kminus/make/make-km/fragments/tasks/check_rs.toml", relative = "git" },
    { path = "./mods/kminus/make/make-km/fragments/tasks/clippy_rs.toml", relative = "git" },
    { path = "./mods/kminus/make/make-km/fragments/tasks/fmt_rs.toml", relative = "git" },
    { path = "./mods/kminus/make/make-km/fragments/tasks/license_rs.toml", relative = "git" },
    { path = "./mods/kminus/make/make-km/fragments/tasks/outdated_rs.toml", relative = "git" },
    { path = "./mods/kminus/make/make-km/fragments/tasks/machete_rs.toml", relative = "git" },
    { path = "./mods/kminus/make/make-km/fragments/tasks/audit_rs.toml", relative = "git" },
    { path = "./mods/kminus/make/make-km/fragments/tasks/deny_rs.toml", relative = "git" },
    { path = "./mods/kminus/make/make-km/fragments/tasks/pants_rs.toml", relative = "git" },

    # itest spawns the full kminus stack via the km orchestrator, which
    # in turn launches control-plane, pod-runner, and virtual-kubelet.
    # Pull in their build tasks and the assembly copy step so
    # `cargo make itest` from this module bundles every binary km needs
    # under target/dist/ without manual plumbing.
    { path = "./mods/pod-runner/make/make-km/fragments/tasks/build_rs.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/build_go.toml", relative = "git" },
    { path = "./mods/virtual-kubelet/make/make-km/fragments/tasks/build_go.toml", relative = "git" },
    { path = "./make/make-km/fragments/tasks/assembly.toml", relative = "git" },

    { path = "./make/make-km/fragments/hooks/banner.toml", relative = "git" },
    { path = "./make/make-km/fragments/hooks/start.toml", relative = "git" },
    { path = "./make/make-km/fragments/hooks/stop.toml", relative = "git" },
    { path = "./make/make-km/fragments/hooks/failure.toml", relative = "git" },
]

[tasks.clean]
plugin = "td-task-tracker"
category = "01 - Clean"
description = "Clean kminus (use --all to also wipe caches)"
alias = "__km__clean_rs_kminus"

[tasks.lock]
plugin = "td-task-tracker"
category = "02 - Tidy"
description = "Regenerate kminus lockfile"
alias = "__km__lock_rs_kminus"

[tasks.build]
plugin = "td-task-tracker"
category = "03 - Build"
description = "Build kminus"
alias = "__km__build_rs_kminus"

[tasks.test]
plugin = "td-task-tracker"
category = "04 - Test"
description = "Test kminus"
alias = "__km__test_rs_kminus"

[tasks.itest]
plugin = "td-task-tracker"
category = "04 - Test"
description = "Run kminus integration tests"
alias = "__km__itest_rs_kminus"

[tasks.check]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Check kminus"
alias = "__km__check_rs_kminus"

[tasks.clippy]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Run clippy on kminus"
alias = "__km__clippy_rs_kminus"

[tasks.fmt]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Format kminus"
alias = "__km__fmt_rs_kminus"

[tasks.license]
plugin = "td-task-tracker"
category = "06 - Compliance"
description = "Report licenses for kminus"
alias = "__km__license_rs_kminus"

[tasks.outdated]
plugin = "td-task-tracker"
category = "05 - Inspect"
description = "Report outdated dependencies for kminus"
alias = "__km__outdated_rs_kminus"

[tasks.machete]
plugin = "td-task-tracker"
category = "05 - Inspect"
description = "Run machete on kminus"
alias = "__km__machete_rs_kminus"

[tasks.audit]
plugin = "td-task-tracker"
category = "07 - Shield"
description = "Audit kminus"
alias = "__km__audit_rs_kminus"

[tasks.deny]
plugin = "td-task-tracker"
category = "07 - Shield"
description = "Run deny on kminus"
alias = "__km__deny_rs_kminus"

[tasks.pants]
plugin = "td-task-tracker"
category = "07 - Shield"
description = "Run pants on kminus"
alias = "__km__pants_rs_kminus"

[tasks.compose]
plugin = "td-task-tracker"
category = "00 - Make"
description = "Task 'compose' for kminus project"
private = true
run_task = [
    { name = [
        "build",
        "test",
        "check",
        "clippy",
        "fmt",
        "license",
        "outdated",
        "machete",
        "audit",
        "deny",
        "pants"
    ] }
]

[tasks.make]
plugin = "td-task-tracker"
category = "00 - Make"
description = "Full build and verification"
run_task = [
    { name = [
        "clean",
        "compose"], condition = { env = { "CLEAN" = "true" } } },
    { name = [
        "compose"
    ] }
]

[tasks.default]
plugin = "td-task-tracker"
alias = "make"

[tasks.__km__deny_rs_kminus]
plugin = "td-task-tracker"
category = "07 - Shield"
description = "Task 'deny' for kminus project"
cwd = "${KM_ROOT}/mods/kminus"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-km/libraries/log.ds

    debug "🚀 ${td-cargo} %{td-toolchain-token}%{td-toolchain} deny --locked %{td-target-token} %{td-target} --log-level error --all-features --manifest-path ${PROJECT_RS_KMINUS_CARGO_TOML} --config ${DENY_TOML} check bans advisories sources"
    exec --fail-on-error ${td-cargo} %{td-toolchain-token}%{td-toolchain} deny --locked %{td-target-token} %{td-target} --log-level error --all-features --manifest-path ${PROJECT_RS_KMINUS_CARGO_TOML} --config ${DENY_TOML} check bans advisories sources
'''

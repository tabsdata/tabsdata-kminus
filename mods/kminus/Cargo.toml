[package]
description = "Tabsdata kminus: stack orchestrator that launches and supervises the control-plane, pod-runner, and virtual-kubelet."
name = "km"
edition = "2024"
version = "2.0.2"

authors = [
    "Aleix Lascorz Guiu    (tabsleix)      <aleix@tabsdata.com>",
    "Alejandro Abdelnur    (tucu0)         <tucu@tabsdata.com>",
    "Arvind Prabhakar      (aptabs)        <arvind@tabsdata.com>",
    "David Sánchez Frías   (tabsdavid)     <david@tabsdata.com>",
    "Dimas Cabré i Chacón  (aoinokimi)     <dragon@tabsdata.com>",
    "Joaquín Bo Díaz       (joaquin041)    <joaquin@tabsdata.com>",
    "Shreyas Vankayalapati (shreyasvan001) <shreyans@tabsdata.com>"
]
homepage = "https://www.tabsdata.com"
publish = false
repository = "https://github.com/tabsdata/tabsdata-km"
rust-version = "1.94.1"

[[bin]]
name = "km"
path = "src/main.rs"

[profile.dev]
codegen-units = 32
debug = true
incremental = true
lto = "off"
opt-level = 0
panic = "unwind"
strip = "none"

[profile.integration]
inherits = "release"
codegen-units = 64
incremental = true
lto = "off"
opt-level = 0

[profile.assembly]
inherits = "release"
codegen-units = 1
debug = 0
incremental = false
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "debuginfo"

[package.metadata.cargo-machete]
ignored = ["openssl"]

[dependencies]

clap = { version = "4.6.0", features = ["derive"] }
dunce = { version = "1.0.5" }
file-rotate = { version = "0.7" }
kcommon = { path = "../kcommon" }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = { version = "0.9.34" }
strum = { version = "0.28.0", features = ["derive"] }
sysinfo = { version = "0.37.2" }
tokio = { version = "1.50.0", features = ["full"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["signal", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10.76", features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_System_Console"] }

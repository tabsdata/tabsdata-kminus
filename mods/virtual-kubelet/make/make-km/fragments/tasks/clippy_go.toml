[tasks.__km__clippy_go_virtual_kubelet]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Task 'clippy' for virtual-kubelet project"
cwd = "${KM_ROOT}/mods/virtual-kubelet"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-km/libraries/log.ds

    cd ${KM_ROOT}/mods/virtual-kubelet/src/main/go

    debug "🚀 go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./..."
    exec --fail-on-error go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...
'''

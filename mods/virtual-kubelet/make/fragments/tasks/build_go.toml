[tasks.__km__build_go_virtual_kubelet]
plugin = "td-task-tracker"
category = "03 - Build"
description = "Task 'build' for virtual-kubelet project"
cwd = "${KM_ROOT}/mods/virtual-kubelet"
script_runner = "@duckscript"
script = '''
    !include_files ./make/libraries/log.ds

    go_target = exec --fail-on-error python ${GET_GO_TARGET_SCRIPT}
    go_target_lines = split ${go_target.stdout} "\n"
    go_os = array_get ${go_target_lines} 0
    go_arch = array_get ${go_target_lines} 1
    binary_extension = array_get ${go_target_lines} 2
    go_os = trim ${go_os}
    go_arch = trim ${go_arch}
    binary_extension = trim ${binary_extension}
    if not is_empty ${go_os}
        set_env GOOS ${go_os}
        set_env GOARCH ${go_arch}
        debug "🎯 Cross-building Go for GOOS=${go_os} GOARCH=${go_arch}"
    else
        debug "🎯 Building Go for host target"
    end

    # Superseded by CGO_ENABLED=0 below: with cgo off there is no C compiler
    # invocation left to warn. Kept for reference in case cgo is ever
    # re-enabled here.
    # build_os = os_family
    # building_darwin = eq ${go_os} "darwin"
    # building_host_mac = eq ${build_os} "mac"
    # if is_empty ${go_os}
    #     building_darwin = set ${building_host_mac}
    # end
    # if ${building_darwin}
    #     set_env CGO_CFLAGS "-Wno-gnu-folding-constant"
    #     debug "🍎 Suppressing clang GNU-folding warning for cgo (go-m1cpu on darwin)"
    # end

    # Unlike control-plane, this module has no gopsutil/go-m1cpu dependency and
    # compiles no cgo packages at all, so disabling cgo is a no-op for the output
    # today. It is set deliberately, to keep the binary statically linked and to
    # match control-plane rather than differing by accident.
    #
    # The commented block above was inherited from control-plane's go-m1cpu
    # workaround and never applied here. control-plane's copy goes away once it
    # migrates to gopsutil v4; this one can stay, as it is a build choice rather
    # than a workaround.
    set_env CGO_ENABLED "0"
    debug "🚫 Building Go without cgo (statically linked, consistent with control-plane)"

    source_folder = set "${KM_ROOT}/mods/virtual-kubelet/src/main/go"
    target_folder = set "${KM_ROOT}/mods/virtual-kubelet/target"
    output_file = concat ${target_folder} "/virtual-kubelet" ${binary_extension}

    mkdir ${target_folder}

    cd ${source_folder}

    is_assembly = eq ${td-profile} "assembly"
    if ${is_assembly}
        debug "🚀 go build \"-ldflags=-s -w\" -trimpath -o ${output_file} ."
        exec --fail-on-error go build "-ldflags=-s -w" -trimpath -o ${output_file} .
    else
        debug "🚀 go build -o ${output_file} ."
        exec --fail-on-error go build -o ${output_file} .
    end
'''

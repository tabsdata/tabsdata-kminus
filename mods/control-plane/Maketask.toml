extend = [
    { path = "./make/make-km/fragments/plugins/tasks.toml", relative = "git" },

    { path = "./make/make-km/fragments/tasks/permit_py.toml", relative = "git" },
    { path = "./make/make-km/fragments/tasks/permit_rs.toml", relative = "git" },
    { path = "./make/make-km/fragments/tasks/permit_go.toml", relative = "git" },

    { path = "./make/make-km/fragments/common/permit.toml", relative = "git" },

    { path = "./mods/control-plane/make/make-km/fragments/tasks/clean_go.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/lock_go.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/build_go.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/test_go.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/itest_go.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/check_go.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/clippy_go.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/fmt_go.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/license_go.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/outdated_go.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/machete_go.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/audit_go.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/deny_go.toml", relative = "git" },
    { path = "./mods/control-plane/make/make-km/fragments/tasks/pants_go.toml", relative = "git" },

    { path = "./make/make-km/fragments/hooks/banner.toml", relative = "git" },
    { path = "./make/make-km/fragments/hooks/start.toml", relative = "git" },
    { path = "./make/make-km/fragments/hooks/stop.toml", relative = "git" },
    { path = "./make/make-km/fragments/hooks/failure.toml", relative = "git" },

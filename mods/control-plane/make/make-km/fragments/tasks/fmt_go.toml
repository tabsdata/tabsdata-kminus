[tasks.__km__fmt_go_control_plane]
plugin = "td-task-tracker"
category = "08 - Linting"
description = "Task 'fmt' for control-plane project"
cwd = "${KM_ROOT}/mods/control-plane"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-km/libraries/log.ds

    cd ${KM_ROOT}/mods/control-plane/src/main/go

    debug "🚀 gofmt -l ."
    unformatted = exec --fail-on-error gofmt -l .
    unformatted = trim ${unformatted.stdout}
    if not is_empty ${unformatted}
        error "🚫 Files not formatted with gofmt:\n${unformatted}"
        assert_fail
    end
'''

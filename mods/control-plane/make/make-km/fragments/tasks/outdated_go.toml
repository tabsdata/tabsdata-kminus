[tasks.__km__outdated_go_control_plane]
plugin = "td-task-tracker"
category = "05 - Inspect"
description = "Task 'outdated' for control-plane project"
cwd = "${KM_ROOT}/mods/control-plane"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-km/libraries/log.ds

    cd ${KM_ROOT}/mods/control-plane/src/main/go

    debug "🚀 go list -u -m -f "{{if .Update}}{{.Path}} {{.Version}} -> {{.Update.Version}}{{end}}" all"
    exec --fail-on-error go list -u -m -f "{{if .Update}}{{.Path}} {{.Version}} -> {{.Update.Version}}{{end}}" all
'''

# Load test configuration for kminus — 100 pods.
#

pod_count: 100

dispatch_rate: 10

containers:
  min: 1
  max: 3

init_containers:
  min: 0
  max: 2

sidecars:
  min: 0
  max: 1

duration:
  min: 1
  max: 10

failure_probability: 0.1
probe_probability: 0.3
probe_initial_delay: 0
probe_period: 1

test_timeout: 300
monitor_interval: 2

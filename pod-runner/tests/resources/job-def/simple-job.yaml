# Simple Job that runs a command to completion.
apiVersion: batch/v1
kind: Job
metadata:
  name: simple-job
  namespace: default
spec:
  template:
    spec:
      nodeName: virtual-node
      restartPolicy: Never
      containers:
        - name: worker
          image: /dev/null
          command: ["sh", "-c"]
          args: ["echo 'job started' && sleep 2 && echo 'job completed successfully'"]

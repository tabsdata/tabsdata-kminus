# CronJob that runs every minute.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cron
  namespace: default
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          nodeName: virtual-node
          restartPolicy: Never
          containers:
            - name: greeter
              image: /dev/null
              command: ["sh", "-c"]
              args: ["echo \"Hello from cron at $(date)\""]

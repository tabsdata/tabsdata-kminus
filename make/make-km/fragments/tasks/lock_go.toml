[tasks.__km__lock_go]
plugin = "td-task-tracker"
category = "02 - Tidy"
private = true
run_task = [
    { name = [
        "__km__lock_go_control_plane",
        "__km__lock_go_virtual_kubelet"
    ] }
]

[tasks.__km__lock_go_control_plane]
plugin = "td-task-tracker"
category = "02 - Tidy"
private = true
cwd = "${PROJECT_TABSDATA_ROOT_FOLDER}"
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    cd ${PROJECT_TABSDATA_KM_ROOT_FOLDER}/mods/control-plane/src/main/go

    debug "🚀 go mod tidy"
    exec --fail-on-error go mod tidy
    ''']


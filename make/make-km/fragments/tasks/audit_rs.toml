[tasks.__km__audit_rs]
plugin = "td-task-tracker"
category = "07 - Shield"
private = true
run_task = [
    { name = [
        "__km__audit_rs_kcommon",
        "__km__audit_rs_kminus",
        "__km__audit_rs_pod_runner"
    ] }
]

[tasks.__km__audit_rs_kcommon]
plugin = "td-task-tracker"
category = "07 - Shield"
private = true
cwd = "${PROJECT_TABSDATA_ROOT_FOLDER}"
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    debug "🚀 cargo audit --deny warnings --file ${PROJECT_RS_KM_KCOMMON_FOLDER}/Cargo.lock"
    exec --fail-on-error cargo audit --deny warnings --file "${PROJECT_RS_KM_KCOMMON_FOLDER}/Cargo.lock"
    ''']


[tasks.__km__clean_rs]
plugin = "td-task-tracker"
category = "01 - Clean"
private = true
run_task = [
    { name = [
        "__km__clean_rs_kcommon",
        "__km__clean_rs_kminus",
        "__km__clean_rs_pod_runner"
    ] }
]

[tasks.__km__clean_rs_kcommon]
plugin = "td-task-tracker"
category = "01 - Clean"
private = true
cwd = "${PROJECT_TABSDATA_ROOT_FOLDER}"
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    debug "🚀 ${td-cargo} %{td-toolchain-token}%{td-toolchain} clean --locked %{td-target-token} %{td-target} --manifest-path ${PROJECT_RS_KM_KCOMMON_FOLDER}/Cargo.toml"
    exec --fail-on-error ${td-cargo} %{td-toolchain-token}%{td-toolchain} clean --locked %{td-target-token} %{td-target} --manifest-path ${PROJECT_RS_KM_KCOMMON_FOLDER}/Cargo.toml
    ''']


[tasks.__km__clean_root]
private = true
plugin = "td-task-tracker"
category = "01 - Clean"
description = "Task 'clean' for the Root project"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-km/libraries/log.ds

    km_root = get_env KM_ROOT
    target_folder = concat ${km_root} "/target"
    if is_path_exists ${target_folder}
        rm -r ${target_folder}
    end
'''

[tasks.__km__machete_rs]
plugin = "td-task-tracker"
category = "05 - Inspect"
private = true
run_task = [
    { name = [
        "__km__machete_rs_kcommon",
        "__km__machete_rs_kminus",
        "__km__machete_rs_pod_runner"
    ] }
]

[tasks.__km__machete_rs_kcommon]
plugin = "td-task-tracker"
category = "05 - Inspect"
private = true
cwd = "${PROJECT_TABSDATA_ROOT_FOLDER}"
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    debug "🚀 cargo machete --with-metadata ${PROJECT_RS_KM_KCOMMON_FOLDER}"
    exec --fail-on-error cargo machete --with-metadata ${PROJECT_RS_KM_KCOMMON_FOLDER}
    ''']


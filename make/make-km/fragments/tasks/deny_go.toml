[tasks.__km__deny_go]
plugin = "td-task-tracker"
category = "07 - Shield"
private = true
run_task = [
    { name = [
        "__km__deny_go_control_plane",
        "__km__deny_go_virtual_kubelet"
    ] }
]

[tasks.__km__deny_go_control_plane]
plugin = "td-task-tracker"
category = "07 - Shield"
private = true
cwd = "${PROJECT_TABSDATA_ROOT_FOLDER}"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-os/libraries/log.ds

    cd ${PROJECT_TABSDATA_KM_ROOT_FOLDER}/mods/control-plane/src/main/go

    debug "🚀 go mod verify"
    exec --fail-on-error go mod verify
'''


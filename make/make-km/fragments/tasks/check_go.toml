[tasks.__km__check_go]
plugin = "td-task-tracker"
category = "08 - Linting"
private = true
run_task = [
    { name = [
        "__km__check_go_control_plane",
        "__km__check_go_virtual_kubelet"
    ] }
]

[tasks.__km__check_go_control_plane]
plugin = "td-task-tracker"
category = "08 - Linting"
private = true
cwd = "${PROJECT_TABSDATA_ROOT_FOLDER}"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-os/libraries/log.ds

    cd ${PROJECT_TABSDATA_KM_ROOT_FOLDER}/mods/control-plane/src/main/go

    debug "🚀 go vet ./..."
    exec --fail-on-error go vet ./...
'''

[tasks.__km__check_go_virtual_kubelet]
plugin = "td-task-tracker"
category = "08 - Linting"
private = true
cwd = "${PROJECT_TABSDATA_ROOT_FOLDER}"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-os/libraries/log.ds

    cd ${PROJECT_TABSDATA_KM_ROOT_FOLDER}/mods/virtual-kubelet/src/main/go

    debug "🚀 go vet ./..."
    exec --fail-on-error go vet ./...
'''

script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/make-os/libraries/log.ds

    debug "🚀 python ${REPORT_LICENSES_RS_SCRIPT} --name km --project ${PROJECT_RS_KM_KCOMMON_FOLDER} --project ${PROJECT_RS_KM_KMINUS_FOLDER} --project ${PROJECT_RS_KM_POD_RUNNER_FOLDER}"

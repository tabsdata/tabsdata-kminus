[tasks.__km__outdated_go]
plugin = "td-task-tracker"
category = "05 - Inspect"
private = true
run_task = [
    { name = [
        "__km__outdated_go_control_plane",
        "__km__outdated_go_virtual_kubelet"
    ] }
]

[tasks.__km__outdated_go_control_plane]
plugin = "td-task-tracker"
category = "05 - Inspect"
private = true
cwd = "${PROJECT_TABSDATA_ROOT_FOLDER}"
script_runner = "@duckscript"
script = '''
    !include_files ./make/make-os/libraries/log.ds

    cd ${PROJECT_TABSDATA_KM_ROOT_FOLDER}/mods/control-plane/src/main/go

    debug "🚀 go list -u -m -f "{{if .Update}}{{.Path}} {{.Version}} -> {{.Update.Version}}{{end}}" all"
    exec --fail-on-error go list -u -m -f "{{if .Update}}{{.Path}} {{.Version}} -> {{.Update.Version}}{{end}}" all
'''


env_files = [
    { path = "${HOME}/.tabsdata-dev/make.env", defaults_only = true },

    { path = "../../settings/product.env", defaults_only = true },
    { path = "../../settings/output.env", defaults_only = true },
    { path = "../../settings/makers.env", defaults_only = true },
    { path = "../../settings/toolchain.env", defaults_only = true }
]

extend = [
    { path = "./make/make-km/fragments/scripts/environment.toml", relative = "git" },

    { path = "./make/make-km/fragments/common/arguments.toml", relative = "git" },
]

[env]
MAKE_SUCCESS = "true"
ECHO_ENV_FILES = true

CLEAN = "${clean:false}"
PROFILE = "${profile:dev}"

K8S_VERSION = "1.29"

PROJECT_RS_KCOMMON_FOLDER = { value = "${KM_ROOT}/mods/kcommon", normalize = true }
PROJECT_RS_KMINUS_FOLDER = { value = "${KM_ROOT}/mods/kminus", normalize = true }
PROJECT_RS_POD_RUNNER_FOLDER = { value = "${KM_ROOT}/mods/pod-runner", normalize = true }

PROJECT_RS_KCOMMON_CARGO_TOML = { value = "${KM_ROOT}/mods/kcommon/Cargo.toml", normalize = true }
PROJECT_RS_KMINUS_CARGO_TOML = { value = "${KM_ROOT}/mods/kminus/Cargo.toml", normalize = true }
PROJECT_RS_POD_RUNNER_CARGO_TOML = { value = "${KM_ROOT}/mods/pod-runner/Cargo.toml", normalize = true }

MAKE_LIBRARIES_PATH = { value = "${TABSDATA_ROOT}/make/make-os/libraries", normalize = true }

FETCH_K8S_SCRIPT = { value = "${KM_ROOT}/make/make-km/scripts/fetch_k8s_deps.py", normalize = true }
GET_GO_TARGET_SCRIPT = { value = "${KM_ROOT}/make/make-km/scripts/get_go_target.py", normalize = true }
ASSEMBLE_DIST_SCRIPT = { value = "${KM_ROOT}/make/make-km/scripts/assemble_dist.py", normalize = true }
BUMP_VERSION_SCRIPT = { value = "${TABSDATA_ROOT}/devutils/automation/tasks/makers/td-scripts/bump_version.py", normalize = true }
CHECK_NATIVE_LIBS_SCRIPT = { value = "${TABSDATA_ROOT}/devutils/automation/tasks/makers/td-scripts/check_native_libs.py", normalize = true }

DENY_TOML = { value = "${TABSDATA_ROOT}/.cargo/deny.toml", normalize = true }
PANTS_JSON = { value = "${TABSDATA_ROOT}/.cargo/pants.json", normalize = true }

[config]
load_script = [
    '''
    #!@duckscript
    !include_files ./make/make-km/libraries/log.ds

    echo_env_files = get_env ECHO_ENV_FILES

    LOCAL_ROOT = pwd

    ok_make_env = is_path_exists ${HOME}/.tabsdata-dev/make.env
    if ${ok_make_env}
        if eq ${echo_env_files} "true"
            debug "📎 File ${HOME}/.tabsdata-dev/make.env alredy exists"
        end
    else
        if eq ${echo_env_files} "true"
            debug "💈 Copying ${LOCAL_ROOT}/.custom/make-dev.env to ${HOME}/.tabsdata-dev/make.env"
        end
        cp ${LOCAL_ROOT}/.custom/make-dev.env ${HOME}/.tabsdata-dev/make.env
    end

    if eq ${echo_env_files} "true"
        debug "🎈 This build is using the following environment variables files:"
        debug "   - 🪬 ${HOME}/.tabsdata-dev/make.env"
        files = glob_array ${LOCAL_ROOT}/make/settings/*.env
        for file in ${files}
            debug "   - 🪬 ${file}"
        end
    end

    set_env ECHO_ENV_FILES "false"
    ''']

skip_core_tasks = true
skip_rust_env_info = true
skip_crate_env_info = true

reduce_output = false

default_to_workspace = false

init_task = "start"
end_task = "stop"
on_error_task = "failure"

[tasks.banner]
plugin = "td-task-tracker"
category = "90 - Lifecycle"
description = "Show banner when starting make"
private = false
script_runner = "@duckscript"
script = '''
    os = os_family

    make_with_banners = get_env TD_MAKE_WITH_BANNERS
    make_with_banners_empty = is_empty ${make_with_banners}
    make_with_banners_true = eq ${make_with_banners} "true"
    make_with_banners = set ${make_with_banners_empty} or ${make_with_banners_true}

   if ${make_with_banners}
        if eq ${os} "windows"
            cm_run_task banner_windows
        elseif eq ${os} "mac"
            cm_run_task banner_mac
        elseif eq ${os} "linux"
            cm_run_task banner_linux
        end
    end
'''

[tasks.banner_windows]
plugin = "td-task-tracker"
category = "90 - Lifecycle"
private = true
ignore_errors = true
condition = { env = { MAKE_SUCCESS = "true" } }

[tasks.banner_linux]
plugin = "td-task-tracker"
category = "90 - Lifecycle"
private = true
ignore_errors = true
condition = { env = { MAKE_SUCCESS = "true" } }

[tasks.banner_mac]
plugin = "td-task-tracker"
category = "90 - Lifecycle"
private = true
ignore_errors = true
condition = { env = { MAKE_SUCCESS = "true" } }
script = '''
    if command -v imgcat &> /dev/null; then
        echo
        imgcat --width 32 ${KM_ROOT}/make/resources/images/tabsdata.png
    else
        echo
    fi
'''

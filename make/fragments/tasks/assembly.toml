[tasks.__km__assembly_root]
private = true
plugin = "td-task-tracker"
category = "10 - Bundle"
description = "Task 'assembly' for the Root project"
script_runner = "@duckscript"
script = '''
    !include_files ./make/libraries/log.ds

    km_root = get_env KM_ROOT
    profile = get_env profile
    td-target = get_env td-target

    if is_empty ${profile}
        build_folder = set "debug"
    else
        is_dev = eq ${profile} "dev"
        if ${is_dev}
            build_folder = set "debug"
        else
            build_folder = set ${profile}
        end
    end

    if not is_empty ${td-target}
        build_folder = set ${td-target}/${build_folder}
    end

    os_family = os_family

    exec --fail-on-error python ${ASSEMBLE_DIST_SCRIPT} ${km_root} ${build_folder} ${os_family} ${CHECK_NATIVE_LIBS_SCRIPT}
'''

[tasks.__km__permit_go]
plugin = "td-task-tracker"
category = "80 - Verify"
description = "Task 'permit' for Go projects"
private = true
script_runner = "@duckscript"
script = [
    '''
    !include_files ./make/libraries/log.ds

    tabsdata_go_version = set 1.26.2
    set_env TABSDATA_GO_VERSION ${tabsdata_go_version}

    info "♻️️ Checking if the required Go version is installed..."

    go = which go
    if equals ${go} ""
        error "🚫🚫🚫🚫🚫 Go is not available. Make aborted."
        assert_fail
    end

    result = exec go version
    code = set ${result.code}
    if not equals ${code} "0"
        error "🚫🚫🚫🚫🚫 Go is available but unusable. Make aborted."
        assert_fail
    end

    version = trim ${result.stdout}
    info "❇️ Go version: ${version}"

    result = exec python -c "import os, sys, subprocess; v = tuple(map(int, os.environ['TABSDATA_GO_VERSION'].split('.'))); r = subprocess.check_output(['go', 'version']).decode().split()[2][2:]; rv = tuple(map(int, r.split('.'))); sys.exit(0 if rv >= v else 1)"
    code = set ${result.code}
    if not equals ${code} "0"
        error "🚫🚫🚫🚫🚫 The Go version is lesser than requited Go version < ${tabsdata_go_version} >. Make aborted."
        assert_fail
    end
    ''']

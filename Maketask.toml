extend = [
    { path = "./make/fragments/shared/Maketask.toml", relative = "git" },
]

[tasks.make]
plugin = "td-task-tracker"
category = "00 - Make"
description = "Full build and verification"
run_task = [
    { name = [
        "make_go",
        "make_rs"
    ] }
]

[tasks.make_go]
plugin = "td-task-tracker"
category = "00 - Make"
description = "Task 'make' for Go projects"
run_task = [
    { name = [
        "clean_go",
        "compose_go"], condition = { env = { "CLEAN" = "true" } } },
    { name = [
        "compose_go"
    ] }
]

[tasks.make_rs]
plugin = "td-task-tracker"
category = "00 - Make"
description = "Task 'make' for Rust projects"
run_task = [
    { name = [
        "clean_rs",
        "compose_rs"], condition = { env = { "CLEAN" = "true" } } },
    { name = [
        "compose_rs"
    ] }
]

[tasks.compose]
plugin = "td-task-tracker"
category = "00 - Make"
description = "Full build and verification orchestration"
private = true
run_task = [
    { name = [
        "compose_go",
        "compose_rs",
    ] }
]

[tasks.compose_control_plane]
plugin = "td-task-tracker"
category = "00 - Make"
description = "Task 'compose' for control-plane project"
private = true
run_task = [
    { name = [
        "__km__build_go_control_plane",
        "__km__test_go_control_plane",
        "__km__check_go_control_plane",
        "__km__clippy_go_control_plane",
        "__km__fmt_go_control_plane",
        "__km__license_go_control_plane",
        "__km__outdated_go_control_plane",
        "__km__machete_go_control_plane",
        "__km__audit_go_control_plane",
        "__km__deny_go_control_plane",
